[project]
name = "uscis-eb1a-scraper"
version = "0.2.0"
description = "Incremental scraper + analytics pipeline for USCIS AAO EB-1A non-precedent decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uscis_eb1a_scraper"]

[project.scripts]
uscis-eb1a = "uscis_eb1a_scraper.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
